<!DOCTYPE html>
<html>
<head>
  <title>Gaming Buttons</title>

  <style>
    .HHH {
      background-color: rgb(47, 211, 47);
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      border-radius: 20px;
      padding: 10px;
      margin: 5px;
      cursor: pointer;
    }

    .Taker {
      background-color: rgb(56, 2, 87);
      color: white;
    }
  </style>
</head>

<body>

  <button class="HHH" onclick="game(this)">
    Time To Play The Game!
  </button>

  <button class="HHH" onclick="game(this)">
    Time To Play The Game!
  </button>

  <button class="HHH" onclick="game(this)">
    Time To Play The Game!
  </button>

  <button class="HHH" onclick="game(this)">
    Time To Play The Game!
  </button>

  <script>
    function game(buttonElement) {

      if (buttonElement.classList.contains('Taker')) {
        buttonElement.classList.remove('Taker');
        buttonElement.innerHTML = "Time To Play The Game!";
      } else {
        buttonElement.classList.add('Taker');
        buttonElement.innerHTML = "Rest In Peace";
      }

    }
  </script>

</body>
</html>
