<!DOCTYPE html>
<html>
  <head>
    <title> Gaming Button </title>
    <style>
      .HHH{
        background-color: rgb(47, 211, 47);
        color: black;
        font-family: Arial, Helvetica, sans-serif;
        border-radius: 20px;
      }
      .Taker{
        background-color: rgb(56, 2, 87);
        color: rgb(240, 234, 234);
        font-family: Arial, Helvetica, sans-serif;
        border-radius: 20px;
      }
    </style>
  </head>
  <body> 
    <button class="HHH"
    onclick="game()"> Time To Play The Game ! </button>
    <script>
      function game(){
      const buttonElement = document.querySelector('.HHH');
      if (buttonElement.innerHTML==="Time To Play The Game !"){
        buttonElement.innerHTML="Rest In Peace"
        buttonElement.classList.add('Taker')
      }else{
        buttonElement.classList.remove('Taker')
        buttonElement.innerHTML="Time To Play The Game !"
      }
    }
    </script>
  </body>
</html>
