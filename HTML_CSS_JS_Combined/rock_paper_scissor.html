<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>

  <style>
    .para {
      font-size: 30px;
      font-style: italic;
    }
    button{
      background-color: rgb(216, 13, 13);
      color:white;
      font-family: Arial, Helvetica, sans-serif;
      border-radius: 25px;
      padding:7px;
    }
    .move_icon{
      height: 50px;
    }
    .move_button{
      background-color: transparent;
      border:3px solid black;
      width:500px;
      height:500px;
      border-radius: 60px;
      margin: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <p class="para js_score">Rock Paper Scissors</p>

  <button onclick="playGame('Rock')"
  img src="rock_emoji.png"
  class="move_icon move_button">
    Rock
  </button>

  <button onclick="playGame('Paper')"
  img src="paper.png"
  class="move_icon move_button">
    Paper
  </button>

  <button onclick="playGame('Scissors')"
  img src="scissors_emoji.png"
  class="move_icon move_button">
    Scissors
  </button>

  <button onclick="
  score.wins = 0;
  score.losses = 0;
  score.ties = 0;
  alert('The Score was Reset')"> Reset </button>

  <script>

    let score = {
      wins : 0,
      losses : 0,
      ties : 0,
    }

    function pickComputerMove() {

      let randomNumber = Math.random();

      let computerMove = '';

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'Rock';

      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'Paper';

      } else {
        computerMove = 'Scissors';
      }

      return computerMove;
    }

    function playGame(playerMove) {

      let computerMove = pickComputerMove();

      let result = '';

      // Player chooses Rock
      if (playerMove === 'Rock') {

        if (computerMove === 'Rock') {
          result = 'Tie';

        } else if (computerMove === 'Paper') {
          result = 'You Lose';

        } else if (computerMove === 'Scissors') {
          result = 'You Win';
        }

      }

      // Player chooses Paper
      else if (playerMove === 'Paper') {

        if (computerMove === 'Rock') {
          result = 'You Win';

        } else if (computerMove === 'Paper') {
          result = 'Tie';

        } else if (computerMove === 'Scissors') {
          result = 'You Lose';
        }

      }

      // Player chooses Scissors
      else if (playerMove === 'Scissors') {

        if (computerMove === 'Rock') {
          result = 'You Lose';

        } else if (computerMove === 'Paper') {
          result = 'You Win';

        } else if (computerMove === 'Scissors') {
          result = 'Tie';
        }

      }


      if(result==='You Win'){
        score.wins+=1;
      }else if(result ==='You Lose'){
        score.losses+=1;
      }else if(result === 'Tie'){
        score.ties+=1
      }

      updateScore();

      function updateScore(){
      document.querySelector('.js_score').innerHTML = `Wins:${score.wins} , Losses:${score.losses} , Ties:${score.ties}`}
      

      alert(`You picked ${playerMove}. Computer picked  ${computerMove} . ${ result}
      Wins : ${score.wins} , Losses : ${score.losses} , Ties :${score.ties}`);

    }

  </script>

</body>
</html>
