<!DOCTYPE html>
<html>
  <head>
    <title> Amazon Shipping Calculator </title>
    <style>
      .cost_input{
        font-size: 15px;
        padding:10px;
        margin:10px;
        background-color: goldenrod;
      }
      .calculate_button{
        background-color: green;
        color: white;
        border:none;
        font-size: 15px;
        padding:20px 50px;
      }
      
      .error{
        background-color: rgb(233, 3, 3);
        color: white;
        border:none;
        font-size: 15px;
        padding:20px 50px;
      }
      
    </style>
  </head>
  <body>
    <p> Amazon Shipping Calculator </p>
    <p> Orders under $40 =+ $10 Shipping </p>
    <p> Orders above $40 = Free Shipping </p>
    <p class = "js_total_cost" > </p>
    <input placeholder = "Cost of Order"
    class = "js_cost_input cost_input"
    onkeydown="handlecostkeydown(event)">
    <button onclick="calculateTotal()"
    class="calculate_button">Calculate</button>
    <script>
      function calculateTotal() {
  const ButtonElement = document.querySelector('.js_cost_input');
  let cost = Number(ButtonElement.value);

  if (cost <= 0) {
    document.querySelector('.js_total_cost').innerHTML =
      "Error: Cost must be greater than 0";
    ButtonElement.classList.add('error');
    return;
  }

  ButtonElement.classList.remove('error');

  if (cost < 40) {
    cost += 10;
  }

  document.querySelector('.js_total_cost').innerHTML = `$${cost}`;
}

function handlecostkeydown(event) {
  if (event.key === 'Enter') {
    calculateTotal();
  }
}
    </script>

  </body>
</html>
