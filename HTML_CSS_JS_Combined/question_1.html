<!DOCTYPE html>
<html>
  <head>
    <title> Buttons </title>
    <style>
      .cart{
        background-color: yellow;
        color: black;
        padding:10px;
        border-radius: 25px;
        font-family: Arial, Helvetica, sans-serif;
        
      }
      .request{
        background-color: rgb(3, 90, 15);
        color: rgb(192, 223, 178);
        padding:10px;
        border-radius: 25px;
        font-family: Arial, Helvetica, sans-serif;
        
      }
      .schedule{
        background-color: red;
        color: rgb(224, 208, 208);
        padding:10px;
        border-radius: 25px;
        font-family: Arial, Helvetica, sans-serif;
        
      }
    </style>
  </head>
  <body>
    <button class="cart"> Add To Cart </button>
    <button class="request"> Request Now </button>
    <button class="schedule"> Schedule Later </button>
  </body>
</html>
