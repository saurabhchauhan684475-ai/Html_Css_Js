<!DOCTYPE html>
<html>
  <head>
    <title> Class List Contains </title>
  </head>
  <body>
    <button class="js_button"
    onclick="test()"> Test </button>
    <script>
      function test(){
        const buttonElement = document.querySelector('.js_button')
        if(buttonElement.classList.contains('red')){
          console.log("Yeet")
        }else{
          console.log("No Yeet")
        }
      
        }
    
    </script>
  </body>
</html>
