<!DOCTYPE html>
<html>
  <head>
    <title> Search Array </title>
  </head>
  <body>
    <script>
      const array1 = ["apple", "banana", "cherry", "date", "fig", "grape", "search", "search", "search"];
      let found = false;
      for(let i=0;i<array1.length;i++){
        const arrays =array1[i];
        if(arrays === "search"){
          console.log(i);
          found = true;
          break;
      }
    }
    if(!found){
        console.log(-1);
    }
    </script>
  </body>
</html>
