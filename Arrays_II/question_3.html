/<!DOCTYPE html>
<html>
  <head>
    <title> Find Index  </title>
  </head>
  <body>
    <script>
    function findIndex(array , word){
      let found = false;
      for(let i=0;i<array.length;i++){
        const arrays =array[i];
        if(arrays===word){
          found = true;
          console.log(i);
          console.log(word);
        }
      }
      if(!found){
        return -1;
      }
    }
    console.log(findIndex(["apple", "banana", "cherry","yellow", "date", "fig", "grape", "search"],"yellow"));
    </script>
    </body>
</html>
