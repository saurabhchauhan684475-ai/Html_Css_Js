<!DOCTYPE html>
<html>
  <head>
    <title> Remove Egg </title>
  </head>
  <body>
    <script>
      function removeEgg(foods){
        let array1 = [];
        let found = false;
        for(let i=0;i<foods.length;i++){
          const food = foods[i];
          if(food==="egg"){
            continue;
          }
          array1.push(food);
      }
      return array1;
    }
    console.log(removeEgg(["egg","ggg","egg","egg","egg","egg","egg","egg","egg"]));
    </script>
  </body>
</html>
