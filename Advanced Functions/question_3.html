<!DOCTYPE html>
<html>
  <head>
    <title> Start </title>
  </head>
  <button onclick="Start();"> Start </button>
  <body>
    <script>
      function Start(){
        setTimeout(function(){
          const buttonElement = document.querySelector("button");
          buttonElement.innerHTML = "Finished";
        }, 3000);
      }

    </script>
  </body>
</html>
