<!DOCTYPE html>
<html>
  <head>
    <title> Count Positives </title>
  </head>
  <body>
    <script>
      function countPositive(array){
        let count=0;
        for(let i =0; i<array.length;i++){
          if(array[i]>0){
            count++;
          }
        }
        return count;
      }

      console.log(countPositive([2,-3,4,5]));
    </script>
  </body>
</html>
