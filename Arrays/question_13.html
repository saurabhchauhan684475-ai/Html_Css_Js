<!DOCTYPE html>
<html>
  <head>
    <title> Min Max </title>
  </head>
  <body>
    <script>
      function minMax(array){
        let min = array[0];
        let max = array[0];
        for(let i=0;i<array.length;i++){
          if(array[i]<min){
            min=array[i]
          }
          if(array[i]>max){
            max=array[i]
          }
        }
        return {
          min :min,
          max:max,
        };
      }
      console.log(minMax([]));
      console.log(minMax([3]));
    </script>
  </body>
</html>
