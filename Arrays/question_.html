<!DOCTYPE html>
<html>
  <head>
    <title> Array Swap </title>
  </head>
  <body>
    <script>
      function arraySwap(array){
        let lastValue = array.length - 1;
        let firstValue = array[0];
        array[0] = array[lastValue];
        array[lastValue] = firstValue;
        return array;
      }
      console.log(arraySwap([6,9,8,7,8]));
    </script>
  </body>
</html>
