<!DOCTYPE html>
<html>
  <head>
    <title> Increased Array </title>
  </head>
  <body>
    <script>
      function increasedArray(array){
        for(let i =0;i<array.length;i++){
          array[i] = array[i]+1;
        }
        return array;
      }
      console.log(increasedArray([1,2,3,4]));
    </script>
  </body>
</html>
