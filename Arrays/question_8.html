<!DOCTYPE html>
<html>
  <head>
    <title> Add One Array </title>
  </head>
  <body>
    <script>
      function addOne(array){
        for(let i=0 ; i<array.length ; i++){
          array[i] = array[i]+1;
        }
        return array;
      }
      console.log(addOne([1,2,3,4]));
      console.log(addOne([-2,-1,0,99]));
    </script>
  </body>
</html>
