<!DOCTYPE html>
<html>
  <head>
    <title> 2 Arrays Addition </title>
  </head>
  <body>
    <script>
      function addArrays(array1 , array2){
        for(let i=0;i<array1.length;i++){
          array1[i] = array1[i]+array2[i];
        }
        return array1;
      }
      console.log(addArrays([1,2,3],[2,3,4]));
    </script>
  </body>
</html>
