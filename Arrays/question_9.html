<!DOCTYPE html>
<html>
  <head>
    <title> Add Num </title>
  </head>
  <body>
    <script>
      function addNum(array , num){
        for(let i=0; i<array.length ; i++){
          array[i] = array[i]+num;
        }
        return array;
      }
      console.log(addNum([1,2,3],2))
      console.log(addNum([1,2,3],3))
    </script>
  </body>
</html>
