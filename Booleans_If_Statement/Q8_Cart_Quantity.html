<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>

    <style>
      .font-style {
        font-size: large;
        font-style: italic;
      }
    </style>
  </head>

  <body>

    <p class="font-style">Cart Quantity</p>

    <button onclick="
      console.log(`Cart Quantity : ${cartQuantity}`);
    ">
      Cart Quantity
    </button>

    <button onclick="updateCart(1)">
      Add To Cart
    </button>

    <button onclick="updateCart(2)">
      +2
    </button>

    <button onclick="updateCart(3)">
      +3
    </button>

    <button onclick="
      cartQuantity = 0;
      console.log('Cart Was Reset');
      console.log(`Cart Quantity : ${cartQuantity}`);
    ">
      Reset Cart
    </button>

    <script>

      let cartQuantity = 0;

      function updateCart(value) {

        if (cartQuantity + value > 10) {
          console.log('Max Value Reached');
          alert('The Cart is Full');
        } else {
          cartQuantity += value;
          console.log(`Cart Quantity : ${cartQuantity}`);
        }

      }

    </script>

  </body>
</html>
