  <body>

        computerMove='Heads'

        computerMove='Tails'
      }
      let result =''
      if(computerMove==='Heads'){
        result = 'You Win'
      }else if(computerMove==='Tails'){
        result = 'You Loose '
      }
     alert(`You picked : Heads , Computer picked :  ${computerMove} , Result : ${result}` )
