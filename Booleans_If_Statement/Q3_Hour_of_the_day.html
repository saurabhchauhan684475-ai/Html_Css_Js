<!DOCTYPE html>
<html>
  <head>
    <title> Hour Of The Day </title>
  </head>
  <body>
    <script>
      let hour = 16;
      let name = 'Saurabh'
      if(hour>=6 && hour<12){
        console.log(`Good Morning ${name}`)
      }else if(hour>=12 && hour<17){
        console.log(`Good Afternoon ${name}`)
      }else{
        console.log(`Good Night ${name}`)
      }
    </script>
  </body>

</html>
