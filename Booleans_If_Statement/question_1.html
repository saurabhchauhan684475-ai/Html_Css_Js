<!DOCTYPE html>
<html>
  <head>
    <title> Hour Of The Day </title>
  </head>
  <body>
    <script>
      let hour = 23;
      if(hour>=6 && hour<12){
        console.log("Good Morning")
      }else if(hour>=12 && hour<17){
        console.log("Good Afternoon")
      }else{
        console.log("Good Night")
      }
    </script>
  </body>

</html>
