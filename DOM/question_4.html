<!DOCTYPE html>
<html>
  <head>
    <title> Textbox </title>
  </head>
  <body>
  <input placeholder="Enter Your Name"
  class="js_input_name"
  onkeydown="handlekeydown(event)">
  <button > Submit </button>
  <p class="js_result"></p>
    <script>
      function Submit(){
        const submitElement = document.querySelector('.js_input_name');
        const text = document.querySelector('.js_input_name').value;
        document.querySelector('.js_result').innerHTML =
        `Your Name is: ${text}`;
        
      }

      function handlekeydown(event){
        if(event.key==="Enter"){
          Submit();
        }
      }
    
    </script>
  </body>
</html>
